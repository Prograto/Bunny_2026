*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --gold: #C9A84C;
  --gold-light: #F0D080;
  --gold-dim: #8A6E2F;
  --cream: #F5EDD8;
  --deep: #0A0608;
  --rich: #120D10;
  --mid: #1E1520;
  --glass: rgba(255,255,255,0.04);
  --glass-border: rgba(201,168,76,0.18);
}

html { scroll-behavior: smooth; }

body {
  background: var(--deep);
  color: var(--cream);
  font-family: 'DM Sans', sans-serif;
  overflow-x: hidden;
  min-height: 100vh;
}

/* ─── PARTICLES ─── */
#canvas {
  position: fixed; top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none; z-index: 0;
}

section { position: relative; z-index: 1; }

/* ─── NAV ─── */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  display: flex; align-items: center; justify-content: center;
  padding: 22px 40px; gap: 44px;
  background: linear-gradient(180deg, rgba(10,6,8,0.85) 0%, transparent 100%);
}
nav a {
  font-size: 11px; letter-spacing: 3px;
  text-transform: uppercase; color: rgba(245,237,216,0.45);
  text-decoration: none; transition: color 0.3s;
}
nav a:hover { color: var(--gold); }

/* ─── HERO ─── */
#hero {
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  text-align: center; padding: 100px 20px 60px;
  overflow: hidden; position: relative;
}

.orb {
  position: absolute; border-radius: 50%;
  filter: blur(90px); pointer-events: none;
}
.orb-1 { width: 600px; height: 600px; top: -150px; left: -150px;
  background: radial-gradient(circle, rgba(201,168,76,0.18), transparent);
  animation: floatOrb 9s ease-in-out infinite; }
.orb-2 { width: 500px; height: 500px; bottom: -100px; right: -100px;
  background: radial-gradient(circle, rgba(139,47,201,0.15), transparent);
  animation: floatOrb 12s ease-in-out infinite reverse; }
.orb-3 { width: 350px; height: 350px; top: 50%; left: 50%; transform: translate(-50%,-50%);
  background: radial-gradient(circle, rgba(201,168,76,0.08), transparent);
  animation: floatOrb 7s ease-in-out infinite 2s; }

@keyframes floatOrb { 0%,100%{transform:translate(0,0)} 50%{transform:translate(40px,-40px)} }

.hero-ghost-text {
  position: absolute;
  font-family: 'Playfair Display', serif;
  font-size: clamp(70px, 17vw, 220px);
  font-weight: 900; font-style: italic;
  color: transparent;
  -webkit-text-stroke: 1px rgba(201,168,76,0.08);
  top: 50%; left: 50%; transform: translate(-50%,-50%);
  white-space: nowrap; pointer-events: none;
  user-select: none; z-index: 1;
}

.hero-content { position: relative; z-index: 2; max-width: 980px; width: 100%; }

.hero-eyebrow {
  font-size: 11px; letter-spacing: 5px;
  text-transform: uppercase; color: var(--gold);
  margin-bottom: 28px;
  opacity: 0; animation: fadeUp 1s 0.2s forwards;
}

/* ── PHOTO FRAME ── */
.hero-frame {
  position: relative; margin: 0 auto 36px;
  width: min(340px, 82vw);
  opacity: 0; animation: fadeUp 1.2s 0.4s forwards;
}

.hero-frame img, .hero-frame .photo-placeholder {
  width: 100%;
  aspect-ratio: 3/4;
  object-fit: cover;
  border-radius: 22px;
  display: block;
}

.photo-placeholder {
  aspect-ratio: 3/4;
  border-radius: 22px;
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 12px;
  font-family: 'Cormorant Garamond', serif;
  font-style: italic; font-size: 15px;
  color: rgba(201,168,76,0.4);
}

.hero-frame .glow-ring {
  position: absolute; inset: -10px; border-radius: 32px;
  border: 1.5px solid rgba(201,168,76,0.3);
  animation: ringPulse 3s ease-in-out infinite;
  pointer-events: none;
}
.hero-frame .glow-ring-2 {
  position: absolute; inset: -20px; border-radius: 40px;
  border: 1px solid rgba(201,168,76,0.1);
  animation: ringPulse 3s ease-in-out infinite 1.5s;
  pointer-events: none;
}

@keyframes ringPulse { 0%,100%{opacity:0.5;transform:scale(1)} 50%{opacity:1;transform:scale(1.01)} }
